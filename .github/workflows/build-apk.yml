name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOLDPOINT_KEYSTORE_PASSWORD: ${{ secrets.HOLDPOINT_KEYSTORE_PASSWORD || 'holdpoint-site-2026' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Check the calculators
        run: node test/test_calc.js

      - name: Build the app screens
        run: node scripts/build.mjs

      - name: Copy into the Android project
        run: npx cap sync android

      - name: Make sure Android SDK 36 is installed
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; "$SDKM" "platforms;android-36" > /dev/null || true; fi

      - name: Restore the signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.holdpoint-key
          key: holdpoint-signing-key-v1

      - name: Signing key (kept private, never published)
        env:
          KEY_B64: ${{ secrets.HOLDPOINT_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.holdpoint-key
          KS="$HOME/.holdpoint-key/holdpoint.jks"
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$KS"; echo "Using the key from repository secrets."
          elif [ -f "$KS" ]; then
            echo "Using the cached signing key."
          else
            echo "Creating a new signing key."
            keytool -genkeypair -keystore "$KS" -storepass "$HOLDPOINT_KEYSTORE_PASSWORD" -keypass "$HOLDPOINT_KEYSTORE_PASSWORD" \
              -alias holdpoint -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HoldPoint, O=cvlvky, C=QA"
          fi
          echo "HOLDPOINT_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Save the signing key for the next build
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ~/.holdpoint-key
          key: holdpoint-signing-key-v1

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/HoldPoint-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HoldPoint-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish the release
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          V="1.0.${{ github.run_number }}"
          {
            echo "## What's new"
            printf '%s\n' "${COMMIT_MSG:-manual run}" | grep -viE '^(co-authored-by|claude-session|signed-off-by):' || true
            echo ""
            echo "## Install on your phone"
            echo "1. Already have HoldPoint? Open it and tap **Update now** when it asks."
            echo "2. Otherwise tap **HoldPoint-$V.apk** below to download it, then open the file."
            echo "3. Updates install over the old version and keep your records."
          } > notes.md
          gh release create "v$V" "out/HoldPoint-$V.apk" --title "HoldPoint $V" --notes-file notes.md --latest
